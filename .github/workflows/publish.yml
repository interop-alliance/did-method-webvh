name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # required for npm provenance
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Provision pnpm via Corepack (bundled with Node) from the
      # `packageManager` pin in package.json, avoiding the flaky
      # pnpm/action-setup self-installer.
      - name: Enable Corepack
        run: corepack enable

      # Node 24's bundled npm is already >= 11.5.1, as trusted publishing
      # requires. Do not `npm install -g npm@latest` here: npm overwriting
      # itself in the runner toolcache leaves it unable to resolve `sigstore`.

      - name: Validate release tag + permissions
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/validate-release.mjs

      - name: Prepare version
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          echo "Publishing version ${VERSION}"
          npm version --no-git-tag-version --allow-same-version "${VERSION}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Publish to npm
        run: npm publish
